# Mirrors the peer pd-* convention (see pdomain-prep-for-pgdp/.pre-commit-config.yaml).
# Hook list is intentionally kept in lockstep with sibling repos so a single
# `pre-commit install` works the same way across the workspace.

# `just setup` runs `pre-commit install` once; with this directive it also
# installs the post-commit / post-rewrite / post-checkout hooks (see
# `local` repo below) without requiring `--hook-type post-commit`.
#
# Fixes B-11 (post-commit) + B-17 (post-rewrite + post-checkout):
# `__version__` was drifting because hatch-vcs only re-derives the
# version on (re)install. post-commit covers vanilla `git commit`;
# post-rewrite covers `git commit --amend` and `git rebase`;
# post-checkout covers `git switch`/`git checkout` and `git
# cherry-pick` when it leaves HEAD on a different sha. All three
# converge on `just refresh-version` (via
# `scripts/refresh_version_git_hook.sh`) so the refresh entrypoint
# stays single-source.
default_install_hook_types: [pre-commit, post-commit, post-rewrite,
      post-checkout, commit-msg]
# Pin Node for node-based hooks (markdownlint-cli2). Without a pin, nodeenv
# picks the newest release, and nodeenv 1.10.0 crashes on prerelease versions
# such as v27.0.0-alpha. Bump this to the current Node LTS deliberately.
default_language_version:
    node: 26.13.0

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-json
    -   id: check-toml
    -   id: check-added-large-files
        args: [--maxkb=1000]
    -   id: debug-statements
    -   id: check-merge-conflict
-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
    hooks:
    # Run the linter for imports
    -   id: ruff-check
        args: [--select, I, --fix]
    # Automatically fix issues.
    -   id: ruff-check
        args: [--fix]
    # Run the formatter.
    -   id: ruff-format

# Markdown lint. Keep the version aligned with sibling repositories.
# Per-repo rules live in `.markdownlint-cli2.jsonc`.
-   repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: c01a1853c19b175aee6a09f24e2ad9b748c485ad  # frozen: v0.24.1
    hooks:
    -   id: markdownlint-cli2
        exclude: ^docs/superpowers/
    -   id: markdownlint-cli2
        alias: markdownlint-cli2-fix
        args: [--fix]
        exclude: ^docs/superpowers/
        stages: [manual]

# Secret scanner. `make update-hooks` froze this rev at v8.30.0.
-   repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
    -   id: gitleaks

# Commit-message linter. Config in .gitlint; rev in lockstep with pdomain-book-tools.
-   repo: https://github.com/jorisroovers/gitlint
    rev: acc9d9de6369b76d22cb4167029d2035e8730b98  # frozen: v0.19.1
    hooks:
    -   id: gitlint
        stages: [commit-msg]

-   repo: local
    hooks:
    # External hook revisions must be full commit SHAs. A tag can be moved
    # upstream, and pre-commit runs that code on every commit. Update pins
    # only with `just update-hooks` (`pre-commit autoupdate --freeze`).
    -   id: require-frozen-hook-revs
        name: external hook revs are frozen commit SHAs
        language: pygrep
        entry: '^\s+rev:\s+(?![0-9a-f]{40}\s+#\s+frozen:\s+\S)'
        files: ^\.pre-commit-config\.yaml$
    # B-11 + B-17: refresh hatch-vcs derived version after any
    # ref-changing op so `pdomain_ocr_labeler_spa.__version__` and
    # `pdomain-ocr-labeler-ui --version` stay aligned with HEAD/tag state.
    #
    # All three hook stages share a single shell entry point
    # (`scripts/refresh_version_git_hook.sh`) which shells out to
    # `just refresh-version`. Failure is non-fatal — a missing
    # toolchain must not block a commit, rebase, or checkout.
    -   id: refresh-version-post-commit
        name: refresh hatch-vcs version after commit
        entry: scripts/refresh_version_git_hook.sh
        language: script
        stages: [post-commit]
        always_run: true
        pass_filenames: false
        verbose: false
    -   id: refresh-version-post-rewrite
        name: refresh hatch-vcs version after amend/rebase
        entry: scripts/refresh_version_git_hook.sh
        language: script
        stages: [post-rewrite]
        always_run: true
        pass_filenames: false
        verbose: false
    -   id: refresh-version-post-checkout
        name: refresh hatch-vcs version after checkout/cherry-pick
        entry: scripts/refresh_version_git_hook.sh
        language: script
        stages: [post-checkout]
        always_run: true
        pass_filenames: false
        verbose: false
    # B-23: lockfile drift gate. Without this, `pyproject.toml` deps
    # can drift from `uv.lock` and only surface inside `docker build`
    # (where the wheel stage runs `uv export --frozen …`). Catching
    # drift at commit time means M1+ contributors don't accidentally
    # land a stale lockfile that the release pipeline only flags
    # later. `uv lock --check` exits non-zero if `uv.lock` is not in
    # sync with `pyproject.toml` and does NOT modify the lockfile —
    # exactly the behaviour we want from a pre-commit gate.
    -   id: basedpyright
        name: basedpyright (backend type-check)
        description: Runs basedpyright recommended type-checking on src/
          (--level error suppresses stub warnings).
        entry: uv run basedpyright src/pdomain_ocr_labeler_spa --level error
        language: system
        stages: [pre-commit]
        pass_filenames: false
        files: ^src/pdomain_ocr_labeler_spa/.*\.py$
    -   id: uv-lock-check
        name: uv.lock is in sync with pyproject.toml
        entry: uv lock --check
        language: system
        stages: [pre-commit]
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
    -   id: frontend-tsc
        name: frontend tsc -b --noEmit
        description: TypeScript project-references type-check for the React SPA.
        # mise-trust-worktrees trusts generated worktree roots so this can use
        # the project tool versions from mise.toml without per-worktree prompts.
        entry: bash -c 'cd frontend && if command -v mise >/dev/null 2>&1; then
          exec mise exec -- pnpm exec tsc -b --noEmit; else exec pnpm exec tsc
          -b --noEmit; fi'
        language: system
        files:
          ^frontend/(src/.*\.(ts|tsx)|tsconfig.*\.json|package(-lock)?\.json|vite\.config\.ts)$
        pass_filenames: false
    -   id: frontend-eslint
        name: frontend eslint
        description: ESLint flat-config check for the React SPA.
        entry: bash -c 'cd frontend && if command -v mise >/dev/null 2>&1; then
          exec mise exec -- pnpm run --silent lint; else exec pnpm run --silent
          lint; fi'
        language: system
        # Match what eslint actually lints: SPA source, the flat config
        # itself, and dependency manifests (a new dep can change rules
        # via plugins). Ignore patterns inside frontend/eslint.config.js
        # exclude `dist/`, `node_modules/`, and `src/api/types.ts`.
        files:
          ^frontend/(src/.*\.(ts|tsx)|eslint\.config\.js|package(-lock)?\.json)$
        pass_filenames: false
    -   id: frontend-prettier
        name: frontend prettier --check
        description: Prettier format check for the React SPA.
        entry: bash -c 'cd frontend && if command -v mise >/dev/null 2>&1; then
          exec mise exec -- pnpm run --silent format:check; else exec pnpm run
          --silent format:check; fi'
        language: system
        # Prettier covers a broader file set than ESLint (CSS, JSON,
        # config files); keep the path filter wide enough to match.
        # The .prettierignore handles dist/, node_modules/, generated
        # types.ts, and package-lock.json.
        files:
          ^frontend/(src/.*|\.prettierrc\.json|\.prettierignore|package(-lock)?\.json|tsconfig.*\.json|vite\.config\.ts|vitest\.config\.ts|tailwind\.config\.js|postcss\.config\.js|eslint\.config\.js)$
        pass_filenames: false
